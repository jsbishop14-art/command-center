<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command Center — Sync results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9A3412}a:hover{color:#7C2D12}
</style>
</helmet>
<div style="width: 640px; height: 840px; box-sizing: border-box; padding: 40px; background-color: #E4E9F2; background-image: linear-gradient(rgba(22,24,29,0.30), rgba(22,24,29,0.30)), radial-gradient(circle at 8% 6%, rgba(194,65,12,0.20), transparent 38%), radial-gradient(circle at 92% 14%, rgba(47,91,211,0.24), transparent 44%), radial-gradient(circle at 40% 62%, rgba(138,90,0,0.10), transparent 40%), radial-gradient(circle at 78% 96%, rgba(21,128,61,0.16), transparent 46%); font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #16181D; display: flex; align-items: center; justify-content: center">
  <div role="dialog" aria-labelledby="results-title" style="width: 100%; background: rgba(255,255,255,0.66); border: 1px solid rgba(255,255,255,0.85); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border-radius: 14px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.3)">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 id="results-title" style="margin: 0; font-size: 20px">Sync finished</h2>
      <button aria-label="Close" style="width: 36px; height: 36px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B606B" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="font-size: 13px; color: #5B606B; font-family: 'IBM Plex Mono', monospace">sync-[date]-[time] · [n] changes · [tokens] tokens</div>

    <div style="display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.85); border-radius: 10px; padding: 4px 14px">
      <sc-for list="{{changes}}" as="c" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: {{c.line}}">
          <span style="flex: none; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 8px; background: {{c.tagBg}}; color: {{c.tagInk}}; width: 72px; text-align: center">{{c.tag}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13px; font-weight: 500">{{c.text}}</span>
            <span style="font-size: 11px; color: #5B606B">{{c.sub}}</span>
          </span>
          <sc-if value="{{c.revert}}" hint-placeholder-val="{{ true }}">
            <button style="height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.75); font: inherit; font-size: 12px; font-weight: 600">{{c.action}}</button>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="font-size: 12px; color: #5B606B">Skipped, nothing new: [item name]</div>

    <div style="display: flex; justify-content: space-between; gap: 8px">
      <button style="height: 42px; padding: 0 16px; border-radius: 8px; border: 1px solid #B91C1C; background: rgba(255,255,255,0.65); color: #991B1B; font: inherit; font-weight: 600">Revert all from this run</button>
      <button style="height: 42px; padding: 0 18px; border-radius: 8px; border: 0; background: #16181D; color: #FFFFFF; font: inherit; font-weight: 600">Done</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":840}}'>
class Component extends DCLogic {
  renderVals() {
    var inbox = { tag: 'Inbox', tagBg: '#E7EAF1', tagInk: '#273246' };
    var kanban = { tag: 'Kanban', tagBg: '#FCE7DA', tagInk: '#7C2D12' };
    var sched = { tag: 'Schedule', tagBg: '#E3EFE7', tagInk: '#1D4D30' };
    var list = [
      Object.assign({ text: 'Suggested Ohio affordable housing · Josh for N-[id]', sub: 'Waits in Inbox for your Confirm', action: 'Revert', revert: true }, inbox),
      Object.assign({ text: 'Suggested Bishops · Josh, Christine for N-[id]', sub: 'Waits in Inbox for your Confirm', action: 'Revert', revert: true }, inbox),
      Object.assign({ text: 'Added "[card from EZ Binder change]" to Next', sub: 'CC-[id] · Riverwood · source EZ Binder', action: 'Revert', revert: true }, kanban),
      Object.assign({ text: 'Moved "Ohio sites presentation" Next → In progress', sub: 'CC-0042 · from email [subject]', action: 'Revert', revert: true }, kanban),
      Object.assign({ text: 'Proposed Satinwood [task] +[n] days', sub: 'Pending in EZ Binder until you confirm there', action: 'Withdraw', revert: true }, sched)
    ];
    return {
      changes: list.map(function (c, i) { return Object.assign({ line: i === list.length - 1 ? '0' : '1px solid rgba(22,24,29,0.08)' }, c); })
    };
  }
}
</script>
</body>
</html>
